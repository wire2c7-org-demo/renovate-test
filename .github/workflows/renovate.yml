name: Renovate

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      # step の if では secrets を直接参照できないため、job の env 経由で有無を判定する
      RENOVATE_APP_ID: ${{ secrets.RENOVATE_APP_ID }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: ${{ env.RENOVATE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Show token source
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Renovate token: GitHub App"
          else
            echo "Renovate token: GITHUB_TOKEN (fallback)"
          fi

      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # ignorePrAuthor はグローバル専用のオプションのため、renovate.json ではなく環境変数で渡す
          RENOVATE_IGNORE_PR_AUTHOR: 'true'
          LOG_LEVEL: debug
